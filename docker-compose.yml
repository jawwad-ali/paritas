# Local development stack.
#   pnpm infra:up   → PostgreSQL + Redis only (run the apps with `pnpm dev`)
#   pnpm stack:up   → everything, including the API and web containers
name: paritas

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 10

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paritas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paritas}
      POSTGRES_DB: ${POSTGRES_DB:-paritas}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'redis-cli', 'ping']

  # One-off job: apply migrations, then load local demo data (idempotent).
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paritas}:${POSTGRES_PASSWORD:-paritas}@postgres:5432/${POSTGRES_DB:-paritas}?schema=public
    command:
      [
        'sh',
        '-c',
        'node node_modules/prisma/build/index.js migrate deploy && node build/seed/prisma/seed.js',
      ]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Secrets (JWT key, cookie flags) come from your local apps/api/.env;
    # the values below override what differs inside the Docker network.
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-paritas}:${POSTGRES_PASSWORD:-paritas}@postgres:5432/${POSTGRES_DB:-paritas}?schema=public
      REDIS_URL: redis://redis:6379
      SWAGGER_ENABLED: 'true'
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
